app = 'vite-et-gourmand-wandering-tide-4117'
primary_region = 'cdg'

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[build]
  dockerfile = "Dockerfile"
